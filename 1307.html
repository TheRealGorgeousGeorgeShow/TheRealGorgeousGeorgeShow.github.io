<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>1307 | The Gorgeous George Show</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <style>
    html, body {
      margin: 0;
      padding: 0;
      min-height: 100%;
      background: black;
      overflow-y: auto;
      overflow-x: hidden;
    }

    /* Stars background */
    video.bg {
      position: fixed;
      inset: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
      z-index: 0;
    }

    .overlay {
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.18);
      z-index: 0;
      pointer-events: none;
    }

    .page {
      position: relative;
      z-index: 1;
      padding: 24px;
      max-width: 1100px;
      margin: 0 auto;
    }

    /* Back button */
    .back {
      display: inline-block;
      margin-bottom: 18px;
      font-family: "Galliard BT", "Garamond", serif;
      font-size: 22px;
      color: #d4af37;
      text-decoration: none;
      border: 2px solid #d4af37;
      padding: 10px 18px;
      border-radius: 8px;
      background: rgba(212,175,55,0.08);
      transition: 0.25s ease;
    }

    .back:hover {
      background: rgba(212,175,55,0.18);
      box-shadow: 0 0 14px rgba(212,175,55,0.45);
      transform: translateX(3px);
    }

    /* Title glow */
    .title {
      text-align: center;
      margin: 0 0 20px;
      font-family: "Century Old Style", "Old Century", Georgia, serif;
      color: #d4af37;
      font-size: 58px;
      font-weight: 600;
      animation: glowPulse 4.5s ease-in-out infinite;
    }

    @keyframes glowPulse {
      0% {
        text-shadow:
          0 3px 8px rgba(0,0,0,0.75),
          0 0 10px rgba(212,175,55,0.35);
      }
      50% {
        text-shadow:
          0 4px 12px rgba(0,0,0,0.85),
          0 0 22px rgba(212,175,55,0.7),
          0 0 40px rgba(212,175,55,0.35);
      }
      100% {
        text-shadow:
          0 3px 8px rgba(0,0,0,0.75),
          0 0 10px rgba(212,175,55,0.35);
      }
    }

    /* Video container */
    .video-box {
      border: 2px solid #d4af37;
      border-radius: 14px;
      overflow: hidden;
      background: black;
      box-shadow: 0 10px 25px rgba(0,0,0,0.6);
    }

    .video-embed {
      width: 100%;
      aspect-ratio: 16 / 9;
      display: block;
      border: 0;
    }

    .description {
      margin-top: 20px;
      color: #d4af37;
      font-family: "Galliard BT", "Garamond", serif;
      font-size: 20px;
      line-height: 1.5;
      text-shadow: 0 2px 6px rgba(0,0,0,0.75);
    }

  </style>
</head>

<body>

  <video class="bg" autoplay muted loop playsinline>
    <source src="stars.mp4" type="video/mp4">
  </video>
  <div class="overlay"></div>

  <div class="page">

    <a href="index.html" class="back">← Back to Home</a>

    <h1 class="title">1307 Stoneycreek Dr</h1>

    <div class="video-box">
      <iframe
        class="video-embed"
        src="https://www.youtube.com/embed/8Kx_RxZZUi4?modestbranding=1&rel=0&iv_load_policy=3"
        title="1307 Stoneycreek Dr"
        allow="accelerometer; clipboard-write; encrypted-media; gyroscope; picture-in-picture"
        allowfullscreen>
      </iframe>
    </div>

    <div class="description">
      This page documents the story of 1307 Stoneycreek Drive — the house inherited,
      mortgaged, and ultimately lost to the bank. A cautionary chapter in the
      Gorgeous George saga.
    </div>

  </div>

</body>
</html>
